<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Master.crm</title>
    <meta name="description" content="Master.crm - CRM and business management system" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body dir="rtl">
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="brand-block">
          <div class="brand-icon">M</div>
          <div><div class="eyebrow">Master.crm</div><h1>بوابة الوصول الآمن</h1></div>
        </div>
        <div class="login-meta"><span>مدير النظام: Master Admin</span><span class="status-dot"></span></div>
        <label class="field-label" for="pinInput">أدخل الرقم السري</label>
        <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
        <button id="loginBtn" class="primary-btn" type="button">دخول النظام</button>
        <p id="loginError" class="login-error" aria-live="polite"></p>
      </div>
    </div>

    <div id="appShell" class="app-shell hidden">
      <main class="main-panel">
        <header class="topbar"><h2>لوحة التحكم الرئيسية</h2><button id="logoutBtn" class="ghost-btn" type="button">تسجيل الخروج</button></header>
        <section class="content-section active"><div class="panel"><h3>مرحبًا بك في Master.crm</h3><p>تم تسجيل الدخول بنجاح.</p></div></section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
